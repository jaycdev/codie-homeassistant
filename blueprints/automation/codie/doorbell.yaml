blueprint:
  name: Codie doorbell
  description: >-
    The Character says at once that someone is at the door, cutting off whatever it is doing.
    Pick a doorbell binary sensor (announces when it turns on) or a doorbell event entity
    (announces on every press).
  domain: automation
  author: jaycdev
  source_url: https://github.com/jaycdev/codie-homeassistant/blob/main/blueprints/automation/codie/doorbell.yaml
  homeassistant:
    min_version: "2026.11.2"
  input:
    doorbell:
      name: Doorbell
      description: A binary sensor that turns on when the bell rings, or a doorbell event entity.
      selector:
        entity:
          domain:
            - binary_sensor
            - event
    codie:
      name: Codie
      description: The Codie, or Codies, whose Character announces the visitor.
      selector:
        target:
          device:
            integration: codie
          entity:
            integration: codie
            domain: notify
    message:
      name: Message
      description: What the Character says, word for word.
      default: Someone is at the door
      selector:
        text:

# A ring while the Codie is still taking the previous Announcement is dropped.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input doorbell
    # A sensor coming back from unavailable is not a ring.
    not_from:
      - unavailable
    not_to:
      - unavailable
      - unknown

conditions:
  # An event entity changes state on every press; a binary sensor rings when it goes from off
  # to on, not when it starts up already on.
  - condition: template
    value_template: >-
      {{ trigger.platform == 'state'
         and (trigger.to_state.domain == 'event'
              or (trigger.from_state.state == 'off' and trigger.to_state.state == 'on')) }}

actions:
  - action: codie.announce
    target: !input codie
    data:
      message: !input message
      queue: false
