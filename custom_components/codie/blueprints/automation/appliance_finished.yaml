blueprint:
  name: Codie appliance finished
  description: >-
    When an appliance's power stays below a threshold for a while, such as a washing machine
    or dishwasher at the end of its cycle, the Character says so in a Queued announcement:
    once it is idle, and remembered as something it said. Or, if you turn on "In character",
    in its own words, at once.
  domain: automation
  author: jaycdev
  source_url: https://github.com/jaycdev/codie-homeassistant/blob/main/custom_components/codie/blueprints/automation/appliance_finished.yaml
  homeassistant:
    min_version: "2026.11.2"
  input:
    power_sensor:
      name: Power sensor
      description: The sensor that measures the appliance's power use.
      selector:
        entity:
          domain: sensor
          device_class: power
    codie:
      name: Codie
      description: The Codie, or Codies, whose Character announces it.
      selector:
        target:
          device:
            integration: codie
          entity:
            integration: codie
            domain: notify
    message:
      name: Message
      description: >-
        What the Character says, word for word, or the message it says in its own words. At
        most 200 characters, or 15000 in character: a longer message is rejected, never cut
        short.
      default: The washing machine has finished
      selector:
        text:
    threshold:
      name: Finished below
      description: The appliance counts as finished once its power is below this.
      default: 5
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          unit_of_measurement: W
          mode: box
    duration:
      name: For at least
      description: >-
        How long the power must stay below the threshold. Make it longer than the pauses in
        the appliance's cycle, such as a washing machine soaking.
      default:
        minutes: 5
      selector:
        duration:
    in_character:
      name: In character
      description: >-
        Let the Character say it in its own words and personality, instead of word for word. It
        starts after about 8 seconds, cuts off whatever the Character is doing, and spends some
        of the Codie's token quota. Nothing is saved to the chat history.
      default: false
      selector:
        boolean:

mode: single

variables:
  in_character: !input in_character

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input threshold
    for: !input duration

conditions:
  # After a restart the sensor goes from unavailable to its reading, which also counts as
  # dropping below the threshold: only a drop from a real reading means a cycle ended.
  - condition: template
    value_template: >-
      {{ trigger.platform == 'numeric_state'
         and trigger.from_state is not none
         and is_number(trigger.from_state.state) }}

actions:
  - action: codie.announce
    target: !input codie
    data:
      message: !input message
      in_character: !input in_character
      # An announcement in character is always said at once, so it cannot be queued.
      queue: "{{ not in_character }}"
