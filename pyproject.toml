[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = ["pytest_socket", "pytest_homeassistant_custom_component.*", "voluptuous_openapi"]
ignore_missing_imports = true
